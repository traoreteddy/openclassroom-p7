[project]
name = "puls-events-rag"
version = "0.1.0"
description = "POC RAG - Assistant intelligent de recommandation d'événements culturels (OpenClassrooms P7)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "langchain>=0.3",
    "langchain-community>=0.3",
    "langchain-mistralai>=0.2",
    "faiss-cpu>=1.9",
    "httpx>=0.27",
    "pydantic-settings>=2.5",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "jupyter>=1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/puls_events_rag"]

[tool.ruff]
line-length = 100
src = ["src", "tests", "scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
